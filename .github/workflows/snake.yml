name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: joao-m-ferreira
          outputs: |
            dist/snake-dark.svg?color_snake=#FADD0B&color_dots=#FFFFFF&color_bg=#4F60D2
            dist/snake-light.svg?color_snake=#4F60D2&color_dots=#FADD0B
      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
